name: Verify

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read Java version
        id: versions
        shell: bash
        run: echo "java=$(sed -n 's/^java_version=//p' gradle.properties | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.versions.outputs.java }}
          distribution: microsoft

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify formatting
        run: bash ./gradlew -Pzpz.portable=true :spotlessCheck --max-workers=2 --configuration-cache --stacktrace
