name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew -Pbridge.portable=true spotlessCheck --configuration-cache --warning-mode=fail
  attachment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew -Pbridge.portable=true attachmentTestClasses --no-daemon --warning-mode=fail
      - shell: bash
        run: |
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.instrument,java.logging --output build/test-runtime
          separator=:
          if [[ "$RUNNER_OS" == "Windows" ]]; then separator=';'; fi
          build/test-runtime/bin/java -cp "build/classes/java/attachmentTest${separator}build/resources/attachmentTest" ua.zefir.zombiebuddyleafbridge.runtime.RuntimeInstrumentationTest
